{q:"Comment la crise de 1929 fragilise-t-elle les démocraties dans les années 1930 ?",ty:["analytique"],
 b:["1929","1939","Le monde, surtout les États-Unis et l'Europe (Allemagne, France)","1929 : krach de Wall Street (24 octobre, le « jeudi noir »). Les « années 1930 » fixent la fin : en 1939, la guerre change la donne."],
 no:[["La crise",["crise"],"Retournement brutal de la conjoncture : effondrement boursier, bancaire puis industriel, avec chômage de masse."],["Les démocraties",["democraties"],"Régimes fondés sur la souveraineté du peuple, le pluralisme, des élections libres et les libertés individuelles."],["Fragiliser",["fragilise"],"Verbe clé : il faut montrer les menaces (contestation, extrêmes, impuissance) mais aussi les résistances."]],
 p:[["Une crise économique mondiale qui devient une crise sociale",["Du krach de Wall Street (octobre 1929) à la dépression mondiale","Chômage de masse et misère sociale"]],["Des démocraties ébranlées et contestées",["L'impuissance des politiques de déflation","La montée des contestations et des extrêmes"]],["Des démocraties qui résistent en se réformant",["Le New Deal de Roosevelt (1933-1938)","Le Front populaire et les accords de Matignon (1936)"]]],
 alt:"Plan chronologique possible : I. 1929-1932, de la crise boursière à la dépression mondiale ; II. 1933-1934, la démocratie s'effondre en Allemagne et vacille en France ; III. 1933-1938, New Deal et Front populaire, des réponses démocratiques.",
 id:[["Krach de Wall Street, jeudi 24 octobre 1929",0],["Environ 25 % de chômeurs aux États-Unis en 1933",0],["Les banques américaines rapatrient les capitaux prêtés à l'Europe",0],["Politique de déflation du chancelier Brüning en Allemagne (1930-1932)",1],["Le parti nazi obtient 37 % des voix en juillet 1932",1],["Émeute antiparlementaire des ligues à Paris, 6 février 1934",1],["Grands travaux de la Tennessee Valley Authority (1933)",2],["Social Security Act, 1935",2],["Accords de Matignon, 7 juin 1936",2]],
 ti:{i:1,o:[["Des démocraties ébranlées et contestées",1,"Le titre est une idée qui répond au verbe du sujet (« fragilise »)."],["La politique dans les années 1930",0,"Trop vague : c'est un thème, pas une idée. Le correcteur ne sait pas ce que tu vas démontrer."],["1932-1934",0,"Des dates ne sont pas une idée. Elles peuvent compléter un titre, pas le remplacer."],["Les régimes totalitaires",0,"Hors sujet : c'est le chapitre suivant. Le sujet porte sur les démocraties."]]},
 ex:[["Aux États-Unis, la Tennessee Valley Authority (1933) lance de grands travaux : l'État fédéral crée des emplois et relance l'activité, ce qui rompt avec le libéralisme de Hoover.","ok","Précis, daté et exploité : il explique le rôle nouveau de l'État."],["Le plan Marshall (1947) aide l'Europe à se relever de la crise.","hors","Hors des bornes (1947) : il concerne l'après-guerre, pas la crise de 1929."],["Beaucoup de gens étaient très pauvres à cette époque.","vague","Aucun lieu, aucune date, aucun chiffre : ce n'est pas un exemple."],["Il y a eu le Front populaire en 1936.","illus","Juste cité : il faut dire ce qu'il fait (accords de Matignon) et en quoi il répond à la crise."]],
 bt:["Il y a eu le Front populaire en 1936.","En France, le Front populaire arrivé au pouvoir en 1936 obtient la signature des accords de Matignon (7 juin 1936) : hausses de salaires, conventions collectives, délégués du personnel. Cet exemple montre que la démocratie répond à la crise en intégrant les revendications ouvrières plutôt qu'en les réprimant."],
 pp:0,pa:["La crise de 1929 est d'abord une crise économique née aux États-Unis, qui devient rapidement mondiale.","L'effondrement de la Bourse ruine les épargnants et entraîne des faillites bancaires en chaîne, ce qui prive les entreprises de crédit.","Le jeudi 24 octobre 1929, le « jeudi noir », les cours s'effondrent à Wall Street ; en 1933, environ un quart des actifs américains est au chômage.","Cet exemple montre que la crise boursière se transforme en crise industrielle et sociale, d'autant que les banques américaines rapatrient leurs capitaux prêtés à l'Europe, ce qui propage la dépression à l'Allemagne.","Ainsi, la crise touche les sociétés démocratiques au cœur, en plongeant des millions de citoyens dans la misère."],
 in:"En 1936, la photographe Dorothea Lange saisit le visage inquiet d'une mère de famille réduite à la misère en Californie : l'image devient le symbole de la Grande Dépression. Cette crise, déclenchée par le krach de Wall Street en octobre 1929, est un retournement brutal de l'économie qui se propage au monde entier. Elle frappe des démocraties, c'est-à-dire des régimes fondés sur des élections libres, le pluralisme et les libertés, alors que l'Europe sort à peine de la Grande Guerre et que l'Italie fasciste et l'URSS proposent déjà d'autres modèles. Des États-Unis à l'Allemagne et à la France, les années 1930 mettent ces régimes à l'épreuve. Comment la crise de 1929 fragilise-t-elle les démocraties dans les années 1930 ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord comment une crise économique devient une crise sociale, puis d'analyser comment les démocraties sont ébranlées et contestées, et enfin d'exposer comment certaines résistent en se réformant.",
 tr:"La crise économique et sociale touche donc des millions de citoyens. Or, face à cette misère, les gouvernements démocratiques semblent impuissants, ce qui nourrit la contestation.",
 co:"La crise de 1929 fragilise donc profondément les démocraties : elle ruine les économies, plonge les sociétés dans le chômage et nourrit les contestations, jusqu'à la disparition de la démocratie en Allemagne en 1933. Pourtant, aux États-Unis comme en France, des démocraties résistent en renforçant le rôle de l'État avec le New Deal et le Front populaire. Les régimes totalitaires, eux, tirent profit de ces fragilités pour s'affirmer en Europe.",
 fi:{t:"Je vais parler de la crise de 1929. Elle commence aux États-Unis et touche ensuite le monde entier. Il y a eu beaucoup de chômage. Est-ce que la crise a eu des conséquences sur les pays ? Je vais faire trois parties : la crise, les démocraties et les solutions.",e:["accroche","notions","chrono","pbq","annonce","je","enchainement"],n:"Aucune accroche, aucune définition, pas de bornes : on ne sait pas jusqu'où va le sujet. La problématique est réécrite (et affaiblie) au lieu d'être reprise telle quelle. Le plan est annoncé avec « je » et des thèmes, sans connecteurs ni « il conviendra d'étudier… ». Les phrases sont posées les unes après les autres."},
 fc:{t:"Pour conclure, la crise de 1929 a été très grave. Il faut aussi parler de Keynes, dont la Théorie générale (1936) propose de relancer la demande par la dépense publique. Cette crise mène directement à la Seconde Guerre mondiale, qui était donc inévitable.",e:["reponse","nouveau","teleo"],n:"La conclusion ne répond pas à la question (comment la crise fragilise-t-elle les démocraties ?). Keynes est un argument nouveau : il fallait le placer dans le développement. Enfin, « inévitable » est téléologique : on raconte l'histoire à partir de sa fin."}},
{q:"New Deal et Front populaire : deux réponses démocratiques comparables face à la crise ?",ty:["comparatif","debat"],
 b:["1933","1938","Les États-Unis et la France","1933 : Roosevelt entre à la Maison-Blanche et lance le New Deal. 1938 : fin des grandes réformes du New Deal et fin du Front populaire."],
 no:[["New Deal",["new","deal"],"« Nouvelle donne » : politique de Roosevelt (1933-1938) d'intervention de l'État dans l'économie et de protection sociale."],["Front populaire",["front","populaire"],"Coalition des gauches (SFIO, radicaux, soutien du PCF) victorieuse aux élections de mai 1936 ; gouvernement de Léon Blum."],["Réponses démocratiques",["reponses","democratiques"],"Solutions adoptées dans le respect des institutions, du pluralisme et des libertés, à la différence des régimes autoritaires."],["Comparables",["comparables"],"Le sujet impose de comparer : points communs ET différences, puis un jugement."]],
 p:[["Aux États-Unis, l'État relance une économie effondrée",["Roosevelt et les « Cent jours » (1933)","Grands travaux et protection sociale (TVA, Social Security Act)"]],["En France, le Front populaire mène d'abord des réformes sociales",["Victoire électorale de mai 1936 et grèves","Accords de Matignon et lois sociales (congés payés, 40 heures)"]],["Deux réponses démocratiques aux résultats limités mais durables",["Un État plus interventionniste dans le respect des libertés","Des résultats économiques décevants, un héritage social durable"]]],
 alt:"Plan thématique possible : I. Deux contextes de crise différents ; II. Des politiques d'intervention de l'État ; III. Bilans et héritages. Il évite la juxtaposition et compare dans chaque partie.",
 id:[["Emergency Banking Act : réorganisation des banques (mars 1933)",0],["Wagner Act : reconnaissance des droits syndicaux (1935)",0],["Grèves avec occupation d'usines en mai-juin 1936",1],["Loi sur les congés payés (juin 1936)",1],["Blum annonce la « pause » des réformes (février 1937)",2],["Le chômage américain remonte avec la récession de 1937-1938",2]],
 ti:{i:2,o:[["Deux réponses démocratiques aux résultats limités mais durables",1,"Il compare et juge : c'est exactement ce que demande la question."],["Le bilan",0,"Trop vague : bilan de quoi, et quel bilan ?"],["Roosevelt et Blum sont des grands hommes",0,"Jugement de valeur, pas une idée historique."],["Les causes de la crise",0,"Hors de la question : le sujet porte sur les réponses, pas sur les causes."]]},
 ex:[["Le Social Security Act (1935) crée des pensions de retraite et une assurance chômage : pour la première fois, l'État fédéral protège les travailleurs.","ok","Exploité : on comprend en quoi c'est une réponse à la crise."],["Le programme du Conseil national de la Résistance (1944) prévoit la Sécurité sociale.","hors","Hors des bornes : c'est la Libération."],["Roosevelt a aidé les Américains.","vague","Comment ? Quand ? Aucune information vérifiable."],["Les congés payés de 1936.","illus","Cité seulement : dis ce qu'ils changent pour les ouvriers et pourquoi c'est une réponse démocratique."]],
 bt:["Les congés payés de 1936.","La loi du 20 juin 1936 accorde deux semaines de congés payés : beaucoup d'ouvriers partent en vacances pour la première fois. Cela montre que le Front populaire répond à la crise par le progrès social plutôt que par la seule rigueur."],
 pp:0,pa:["Aux États-Unis, la réponse démocratique à la crise passe d'abord par une intervention massive de l'État fédéral.","Élu en 1932, Franklin D. Roosevelt rompt avec le libéralisme de son prédécesseur Hoover, qui comptait sur le retour spontané de la croissance.","Dès mars 1933, l'Emergency Banking Act réorganise les banques, puis la Tennessee Valley Authority lance de grands travaux d'aménagement.","Ces mesures montrent que l'État devient un acteur de l'économie : il protège l'épargne, crée des emplois et relance la demande.","Le New Deal invente ainsi une réponse à la crise qui renforce la démocratie au lieu de la remettre en cause."],
 in:"« La seule chose dont nous devons avoir peur, c'est la peur elle-même », déclare Franklin D. Roosevelt lors de son investiture en mars 1933. Les États-Unis comptent alors environ un quart de chômeurs, tandis que la France, touchée plus tard par la crise, est secouée par l'émeute du 6 février 1934. Le New Deal, ou « nouvelle donne », désigne la politique d'intervention de l'État menée par Roosevelt de 1933 à 1938 ; le Front populaire est la coalition des gauches qui gouverne la France à partir de juin 1936. Ces deux expériences sont des réponses démocratiques, car elles combattent la crise sans renoncer aux élections ni aux libertés. New Deal et Front populaire : deux réponses démocratiques comparables face à la crise ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord la politique de relance menée aux États-Unis, puis d'analyser les réformes sociales du Front populaire, et enfin de comparer leurs résultats et leurs héritages.",
 tr:"Aux États-Unis, la démocratie répond donc à la crise par la relance et la protection sociale. En France, le Front populaire arrive au pouvoir dans un contexte différent, et ses priorités le sont aussi.",
 co:"New Deal et Front populaire sont donc deux réponses démocratiques comparables : dans les deux cas, l'État intervient dans l'économie et protège les travailleurs sans renoncer aux libertés. Mais le New Deal est d'abord une politique de relance, le Front populaire d'abord une politique sociale, et leurs résultats économiques restent limités. Leur héritage, celui d'un État protecteur, sera repris et amplifié après 1945."},

{th:0,n:"1.2",t:"Les régimes totalitaires",s:[
{q:"Comment les régimes totalitaires cherchent-ils à contrôler les sociétés dans l'entre-deux-guerres ?",ty:["analytique"],
 b:["1922","1939","L'Italie fasciste, l'URSS stalinienne, l'Allemagne nazie","1922 : marche sur Rome et arrivée de Mussolini au pouvoir. 1939 : la guerre ouvre une autre période."],
 no:[["Régimes totalitaires",["regimes","totalitaires"],"Régimes qui veulent contrôler tous les aspects de la vie, publique et privée, par un parti unique, un chef, la propagande et la terreur, afin de créer un homme nouveau."],["Contrôler",["controler"],"Encadrer, surveiller, endoctriner et réprimer : le verbe invite à montrer les moyens et leurs limites."],["Les sociétés",["societes"],"L'ensemble de la population : jeunesse, travailleurs, familles, Églises, opposants."]],
 p:[["Un pouvoir concentré entre les mains d'un parti et d'un chef",["Des prises de pouvoir différentes (Rome 1922, Moscou fin des années 1920, Berlin 1933)","Parti unique et culte du chef"]],["Encadrer et endoctriner pour créer un homme nouveau",["Propagande et contrôle de l'information","Encadrement de la jeunesse et des travailleurs"]],["Terroriser et exclure ceux qui résistent",["Police politique et camps","Persécution des « ennemis » : koulaks, opposants, Juifs"]]],
 alt:"Plan comparatif possible : I. Le totalitarisme fasciste ; II. Le totalitarisme stalinien ; III. Le totalitarisme nazi. Attention : sans comparaison dans chaque partie, on juxtapose trois exposés.",
 id:[["Marche sur Rome, octobre 1922",0],["Hitler nommé chancelier, 30 janvier 1933",0],["Le film Le Triomphe de la volonté de Leni Riefenstahl (1935)",1],["Les Jeunesses hitlériennes, seule organisation de jeunesse autorisée (1936), obligatoires en 1939",1],["Grande Terreur en URSS (1937-1938)",2],["Lois de Nuremberg contre les Juifs (septembre 1935)",2]],
 ti:{i:1,o:[["Encadrer et endoctriner pour créer un homme nouveau",1,"Il dit ce que font les régimes et dans quel but."],["La propagande",0,"Un seul mot : c'est un thème. Que démontres-tu sur la propagande ?"],["Hitler, Staline et Mussolini",0,"Une liste de noms n'annonce aucune démonstration."],["La vie quotidienne en Allemagne",0,"Trop étroit : le sujet porte sur les régimes totalitaires, au pluriel."]]},
 ex:[["Pendant la Grande Terreur (1937-1938), le NKVD fait exécuter près de 700 000 personnes : la terreur vise moins des opposants réels qu'une société entière à soumettre.","ok","Chiffré, daté, et l'exemple est interprété."],["Le camp d'Auschwitz-Birkenau, où les nazis assassinent plus d'un million de Juifs à partir de 1942.","hors","Hors des bornes : 1942 appartient à la Seconde Guerre mondiale."],["Les dictateurs faisaient peur à tout le monde.","vague","Ni lieu, ni date, ni fait précis."],["Il y avait la propagande avec des affiches.","illus","Quelle affiche, quel message, quel effet recherché ?"]],
 bt:["Il y avait la propagande avec des affiches.","Dans l'URSS des années 1930, les affiches montrent Staline en « petit père des peuples » entouré d'enfants souriants : la propagande fabrique un culte du chef qui doit susciter l'adhésion et faire oublier la famine et la terreur."],
 pp:2,pa:["Pour contrôler les sociétés, les régimes totalitaires utilisent aussi la terreur.","Des polices politiques surveillent la population et arrêtent sans jugement tous ceux qui sont suspectés de s'opposer au régime.","En URSS, pendant la Grande Terreur de 1937-1938, le NKVD fait exécuter près de 700 000 personnes et envoie des centaines de milliers d'autres au Goulag.","Cet exemple montre que la terreur ne vise pas seulement des opposants réels : elle crée un climat de peur qui pousse chacun à l'obéissance et à la dénonciation.","La violence est donc un instrument de gouvernement au même titre que la propagande."],
 in:"Le 30 janvier 1933, des milliers de SA défilent aux flambeaux sous la porte de Brandebourg pour célébrer la nomination d'Hitler à la chancellerie. L'Allemagne rejoint alors l'Italie de Mussolini, au pouvoir depuis 1922, et l'URSS de Staline parmi les régimes que l'on qualifie de totalitaires. Un régime totalitaire veut contrôler tous les aspects de la vie, publique et privée, grâce à un parti unique, un chef, la propagande et la terreur, afin de créer un homme nouveau. Dans une Europe fragilisée par la Grande Guerre puis par la crise de 1929, ces régimes rejettent la démocratie libérale. Comment les régimes totalitaires cherchent-ils à contrôler les sociétés dans l'entre-deux-guerres ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord la concentration du pouvoir entre les mains d'un parti et d'un chef, puis d'analyser l'encadrement et l'endoctrinement des sociétés, et enfin d'exposer le recours à la terreur et à l'exclusion.",
 tr:"Le parti unique est donc maître de l'État. Mais il ne se contente pas de gouverner : il veut aussi transformer les esprits et façonner un homme nouveau.",
 co:"Les régimes totalitaires contrôlent donc les sociétés en combinant la concentration du pouvoir, l'endoctrinement des masses et la terreur. Leurs idéologies diffèrent, la lutte des classes en URSS, la race en Allemagne, l'État en Italie, mais leurs méthodes se ressemblent. Ce contrôle n'est pourtant jamais total, comme le montrent les formes d'opposition d'une partie de la jeunesse allemande.",
 fi:{t:"Dans ce devoir, je vais parler des régimes totalitaires en Italie, en URSS et en Allemagne entre 1922 et 1939. Hitler, Staline et Mussolini étaient des dictateurs très méchants. Comment ont-ils fait pour garder le pouvoir ? I) Le pouvoir II) La propagande III) La terreur.",e:["accroche","notions","pbq","annonce","je","enchainement"],n:"Le cadre est donné, mais sans accroche ni définition du totalitarisme ; le jugement moral remplace l'analyse. La problématique est remplacée par une autre question. Le plan est annoncé avec des numéros au lieu de « il conviendra d'étudier… puis… enfin… »."},
 fc:{t:"En conclusion, j'ai montré que les régimes totalitaires étaient horribles. Ces régimes ont contrôlé la société par la propagande, la terreur, le parti unique, le culte du chef, l'encadrement de la jeunesse, la police politique, les camps, et aussi l'économie avec les plans quinquennaux de Staline qui industrialisent l'URSS à marche forcée. C'est pour cela qu'ils allaient forcément déclencher la Seconde Guerre mondiale.",e:["je","longueur","nouveau","teleo"],n:"« J'ai montré » : pas de « je ». La conclusion récite le développement au lieu de répondre en quelques lignes, ajoute un argument nouveau (les plans quinquennaux) et se termine par une ouverture téléologique (« forcément »)."}},
{q:"Nazisme et stalinisme : deux totalitarismes identiques ?",ty:["comparatif","debat"],
 b:["1929","1939","L'Allemagne et l'URSS","Fin des années 1920 : Staline seul maître de l'URSS. 1933 : Hitler au pouvoir. 1939 : pacte germano-soviétique et guerre."],
 no:[["Nazisme",["nazisme"],"Idéologie et régime d'Hitler, fondés sur le racisme, l'antisémitisme, le nationalisme et le culte du chef."],["Stalinisme",["stalinisme"],"Système de pouvoir de Staline en URSS : dictature du parti communiste, culte du chef, planification et terreur de masse."],["Totalitarismes",["totalitarismes"],"Régimes qui veulent contrôler toute la société pour créer un homme nouveau."],["Identiques",["identiques"],"Le mot invite à discuter : chercher les points communs ET les différences, puis trancher."]],
 p:[["En Allemagne, un totalitarisme fondé sur la race",["Une idéologie raciste et antisémite","L'exclusion des Juifs : des lois de Nuremberg (1935) à la Nuit de Cristal (1938)"]],["En URSS, un totalitarisme fondé sur la lutte des classes",["Construire le socialisme : collectivisation et plans quinquennaux","Éliminer les « ennemis de classe » : koulaks et Grande Terreur"]],["Des méthodes communes de contrôle",["Parti unique, culte du chef et propagande","Police politique, camps et terreur de masse"]]],
 alt:"Plan thématique possible : I. Des idéologies opposées ; II. Des méthodes semblables ; III. Des violences de nature différente.",
 id:[["Nuit de Cristal, 9-10 novembre 1938",0],["Lois de Nuremberg, septembre 1935",0],["Dékoulakisation et collectivisation forcée (1929-1933)",1],["Premier plan quinquennal (1928-1932)",1],["Gestapo et NKVD : deux polices politiques",2],["Dachau, premier camp de concentration (mars 1933)",2]],
 ti:{i:2,o:[["Des méthodes communes de contrôle",1,"Il dit précisément ce qui rapproche les deux régimes."],["Les points communs",0,"Trop vague : lesquels ?"],["Staline et Hitler",0,"Des noms, pas une idée."],["Le pacte germano-soviétique",0,"Un événement, pas une idée de partie, et il ne répond pas à « identiques ? »."]]},
 ex:[["En 1930-1931, la dékoulakisation déporte environ 1,8 million de paysans : en URSS, l'ennemi est défini par sa classe sociale, et non par sa naissance comme en Allemagne.","ok","L'exemple sert à comparer : c'est exactement ce qu'il faut faire."],["La bataille de Stalingrad (1942-1943).","hors","Hors des bornes et hors du sujet : c'est une bataille de la guerre."],["Les deux régimes étaient pareils.","vague","Une affirmation, pas un exemple, et elle est fausse sans nuance."],["Hitler faisait des discours.","illus","Où, quand, avec quel effet ? Le culte du chef doit être expliqué."]],
 bt:["Hitler faisait des discours.","De 1933 à 1938, aux congrès du parti nazi à Nuremberg, Hitler s'adresse à des dizaines de milliers de militants alignés : la mise en scène fait du Führer l'incarnation du peuple, comme les portraits géants de Staline en URSS. Cela montre que le culte du chef est une méthode commune aux deux régimes."],
 pp:0,pa:["En Allemagne, le totalitarisme nazi repose d'abord sur une idéologie raciste.","En effet, pour Hitler, l'histoire est une lutte entre des races, et la « communauté du peuple » doit être purifiée de ceux qu'il considère comme des ennemis biologiques, en premier lieu les Juifs.","Les lois de Nuremberg de septembre 1935 retirent la citoyenneté aux Juifs allemands et interdisent les mariages entre Juifs et non-Juifs.","Cet exemple montre que, dans le nazisme, l'exclusion dépend de la naissance : un Juif ne peut pas échapper à la persécution en adhérant au régime.","C'est ce qui distingue le totalitarisme nazi du stalinisme, où l'ennemi est défini par sa classe sociale."],
 in:"En août 1939, le monde apprend avec stupeur la signature d'un pacte de non-agression entre l'Allemagne nazie et l'URSS, deux régimes qui se présentaient jusque-là comme des ennemis absolus. Le nazisme, idéologie raciste d'Hitler au pouvoir depuis 1933, et le stalinisme, système de pouvoir de Staline seul maître de l'URSS depuis la fin des années 1920, sont qualifiés de totalitaires : ils veulent contrôler toute la société pour créer un homme nouveau. Dans une Europe fragilisée par la crise de 1929, la comparaison entre les deux régimes divise encore les historiens. Nazisme et stalinisme : deux totalitarismes identiques ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord le totalitarisme racial nazi, puis d'analyser le totalitarisme de classe stalinien, et enfin d'exposer les méthodes communes de contrôle des deux régimes.",
 tr:"Le nazisme fonde donc son projet sur la race. En URSS, le projet stalinien vise lui aussi une société purifiée, mais selon une tout autre logique, celle de la lutte des classes.",
 co:"Nazisme et stalinisme ne sont donc pas identiques : l'un exclut par la race, l'autre par la classe sociale, et leurs projets s'opposent. Ils partagent pourtant les mêmes méthodes, parti unique, culte du chef, propagande, police politique et camps, ce qui justifie de les rapprocher sous le terme de totalitarisme. Leur pacte de 1939 ne dure pas : la guerre les oppose à partir de 1941."},
{q:"En quoi la guerre d'Espagne (1936-1939) est-elle un affrontement entre démocratie et totalitarismes ?",ty:["analytique"],lite:1,
 b:["1936","1939","L'Espagne, mais aussi l'Europe (Allemagne, Italie, URSS, France, Royaume-Uni)","Juillet 1936 : soulèvement militaire contre la République espagnole. Avril 1939 : victoire de Franco."],
 no:[["Guerre d'Espagne",["guerre","espagne"],"Guerre civile (1936-1939) entre les républicains, soutenus par le Front populaire espagnol, et les nationalistes du général Franco."],["Démocratie",["democratie"],"La Seconde République espagnole, régime parlementaire issu des élections."],["Totalitarismes",["totalitarismes"],"Ici l'Italie fasciste et l'Allemagne nazie qui soutiennent Franco, et l'URSS qui aide les républicains."]]}
]},
{th:0,n:"1.3",t:"La Seconde Guerre mondiale",s:[
{q:"Pourquoi la Seconde Guerre mondiale est-elle une guerre d'anéantissement ?",ty:["analytique"],
 b:["1939","1945","Le monde : Europe, URSS, Asie et Pacifique","Septembre 1939 : invasion de la Pologne. Septembre 1945 : capitulation du Japon."],
 no:[["Guerre d'anéantissement",["aneantissement"],"Guerre qui ne vise pas seulement la victoire militaire mais la destruction de l'ennemi, y compris des civils et de peuples entiers."],["Guerre mondiale",["mondiale"],"Conflit qui implique des belligérants et des théâtres d'opérations sur plusieurs continents."]],
 p:[["Une guerre mondiale qui mobilise toutes les forces",["De la guerre européenne (1939) à la guerre mondiale (1941)","Une guerre totale : économies et sociétés mobilisées"]],["Une guerre qui prend les civils pour cible",["Bombardements massifs, de Coventry à Hiroshima","Violences d'occupation et massacres"]],["Le génocide des Juifs et des Tsiganes",["La « Shoah par balles » des Einsatzgruppen","Les centres de mise à mort"]]],
 alt:"Plan chronologique possible : I. 1939-1941, une guerre de conquête ; II. 1941-1942, la guerre devient anéantissement à l'Est ; III. 1943-1945, la destruction des civils jusqu'à Hiroshima.",
 id:[["Opération Barbarossa, 22 juin 1941",0],["Pearl Harbor, 7 décembre 1941",0],["Bombardement de Dresde, février 1945",1],["Massacre d'Oradour-sur-Glane, 10 juin 1944",1],["Massacre de Babi Yar, septembre 1941",2],["Conférence de Wannsee, 20 janvier 1942",2]],
 ti:{i:1,o:[["Une guerre qui prend les civils pour cible",1,"Il formule une idée qui démontre l'anéantissement."],["Les civils",0,"Un thème, pas une idée."],["1944-1945",0,"Des dates ne disent rien de ce que tu démontres."],["La Résistance française",0,"Hors sujet : c'est le chapitre sur la France."]]},
 ex:[["Les 29 et 30 septembre 1941, à Babi Yar près de Kiev, les Einsatzgruppen assassinent 33 771 Juifs : l'anéantissement commence par des fusillades de masse avant les chambres à gaz.","ok","Précis, chiffré, et il explique une étape du génocide."],["La bataille de Verdun (1916).","hors","Première Guerre mondiale : hors des bornes."],["La guerre a été très violente.","vague","Rien de précis : à quoi voit-on cette violence ?"],["Hiroshima.","illus","Juste un nom. Date, bilan, et sens de l'exemple ?"]],
 bt:["Hiroshima.","Le 6 août 1945, la bombe atomique lancée sur Hiroshima tue entre 60 000 et 70 000 personnes sur le coup, presque toutes civiles. Cet exemple montre que la guerre se termine par une arme capable d'anéantir une ville entière."],
 pp:2,pa:["La guerre d'anéantissement atteint son paroxysme avec le génocide des Juifs et des Tsiganes.","En effet, pour les nazis, ces populations doivent disparaître parce qu'elles sont jugées racialement inférieures ou dangereuses, quel que soit leur comportement.","À partir de l'été 1941, les Einsatzgruppen fusillent les Juifs à l'arrière du front de l'Est, comme à Babi Yar où 33 771 personnes sont assassinées en deux jours.","Cet exemple montre que l'extermination accompagne l'invasion de l'URSS : guerre de conquête et génocide sont liés dans le projet nazi.","Avec la conférence de Wannsee en janvier 1942 puis les centres de mise à mort, le génocide devient industriel et fait environ six millions de victimes juives."],
 in:"En janvier 1945, les soldats soviétiques qui entrent à Auschwitz découvrent quelques milliers de survivants épuisés au milieu des installations d'un centre de mise à mort. La Seconde Guerre mondiale, de l'invasion de la Pologne en septembre 1939 à la capitulation du Japon en septembre 1945, fait près de 60 millions de morts, dont au moins la moitié de civils. Elle devient mondiale en 1941 avec l'entrée en guerre de l'URSS et des États-Unis et s'étend de l'Europe au Pacifique. On parle de guerre d'anéantissement, car il ne s'agit plus seulement de vaincre l'ennemi, mais de détruire des populations entières. Pourquoi la Seconde Guerre mondiale est-elle une guerre d'anéantissement ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord une guerre mondiale qui mobilise toutes les forces, puis d'analyser la violence dirigée contre les civils, et enfin d'exposer le génocide des Juifs et des Tsiganes.",
 tr:"La guerre mobilise donc des sociétés entières. Dès lors, les civils deviennent eux-mêmes des cibles.",
 co:"La Seconde Guerre mondiale est donc une guerre d'anéantissement parce qu'elle mobilise toutes les forces des belligérants, vise délibérément les civils et culmine avec le génocide des Juifs et des Tsiganes. Elle fait près de 60 millions de morts, dont au moins la moitié de civils. Dès 1945, les vainqueurs cherchent à juger ces crimes, avec le procès de Nuremberg.",
 fi:{t:"La Seconde Guerre mondiale commence en 1939 et se termine en 1945. Elle a fait 60 millions de morts. C'est la guerre la plus meurtrière de l'histoire. Pourquoi cette guerre a-t-elle été si violente ? Tout d'abord, nous verrons la guerre, ensuite les civils, enfin la Shoah.",e:["accroche","notions","spatial","pbq","annonce","enchainement"],n:"Commencer par des dates n'est pas une accroche. La notion clé, « guerre d'anéantissement », n'est jamais définie, et l'espace n'est pas précisé. La problématique est changée (« si violente » au lieu d'« anéantissement »). L'annonce donne des thèmes avec « nous verrons » au lieu de « il conviendra d'étudier »."},
 fc:{t:"Pour conclure, la Seconde Guerre mondiale est une guerre d'anéantissement car elle mobilise toutes les forces, vise les civils et aboutit au génocide. Ensuite, la guerre froide oppose les États-Unis et l'URSS de 1947 à 1991 : le blocus de Berlin, la guerre de Corée, la crise de Cuba et la chute du mur montrent que le monde reste divisé pendant plus de quarante ans.",e:["ouverture","longueur"],n:"La réponse est bonne, mais l'ouverture devient un second développement : une seule phrase suffit, sans dérouler toute la guerre froide."}},
{q:"Comment la guerre devient-elle mondiale entre 1939 et 1942 ?",ty:["chronologique"],
 b:["1939","1942","Europe, URSS, Afrique du Nord, Asie et Pacifique","1er septembre 1939 : invasion de la Pologne. 1942 : apogée de l'Axe et premiers tournants (Midway, El Alamein, Stalingrad)."],
 no:[["Devenir",["devient"],"Le verbe indique une évolution : le plan chronologique est le plus logique."],["Mondiale",["mondiale"],"Une guerre est mondiale quand ses belligérants et ses fronts couvrent plusieurs continents."]],
 p:[["1939-1940 : une guerre européenne remportée par l'Allemagne",["L'invasion de la Pologne (septembre 1939)","La « guerre éclair » et la défaite de la France (mai-juin 1940)"]],["1941 : la guerre devient mondiale",["L'invasion de l'URSS, 22 juin 1941","Pearl Harbor et l'entrée en guerre des États-Unis, décembre 1941"]],["1942 : l'apogée de l'Axe et les premiers tournants",["Une domination maximale sur l'Europe et l'Asie","Midway, El Alamein, Stalingrad : l'Axe est arrêté"]]],
 alt:"Plan thématique possible : I. L'extension géographique du conflit ; II. L'entrée en guerre des grandes puissances ; III. Une guerre de coalitions (Axe contre Alliés).",
 id:[["Pacte germano-soviétique, 23 août 1939",0],["Armistice franco-allemand, 22 juin 1940",0],["Opération Barbarossa, 22 juin 1941",1],["Attaque japonaise sur Pearl Harbor, 7 décembre 1941",1],["Bataille de Midway, juin 1942",2],["Seconde bataille d'El Alamein, octobre-novembre 1942",2]],
 ti:{i:1,o:[["1941 : la guerre devient mondiale",1,"La date est associée à une idée : c'est le bon usage d'un titre chronologique."],["1941",0,"Une date seule n'est pas une idée."],["L'URSS",0,"Trop étroit : 1941, c'est aussi l'entrée en guerre des États-Unis."],["Les causes de la guerre",0,"Hors sujet : on ne te demande pas pourquoi la guerre éclate."]]},
 ex:[["Le 7 décembre 1941, l'attaque japonaise sur Pearl Harbor fait entrer les États-Unis dans la guerre : le conflit s'étend au Pacifique et oppose désormais deux coalitions sur plusieurs continents.","ok","L'exemple explique le passage à une guerre mondiale."],["Le débarquement de Normandie, 6 juin 1944.","hors","Hors des bornes (1939-1942)."],["Beaucoup de pays sont entrés en guerre.","vague","Lesquels, quand ?"],["La bataille de Stalingrad.","illus","Dates, enjeu et signification ?"]],
 bt:["La bataille de Stalingrad.","À partir d'août 1942, la Wehrmacht s'enlise à Stalingrad ; la capitulation de la VIe armée en février 1943 marque le premier grand échec allemand à l'Est. Cela montre que l'expansion de l'Axe est stoppée."],
 pp:1,pa:["En 1941, la guerre change d'échelle et devient véritablement mondiale.","En effet, deux grandes puissances qui étaient restées hors du conflit sont désormais entraînées dans la guerre.","Le 22 juin 1941, l'Allemagne envahit l'URSS ; le 7 décembre, le Japon attaque la flotte américaine à Pearl Harbor.","Ces deux événements montrent que le conflit s'étend de l'Europe au Pacifique et oppose deux coalitions, l'Axe et les Alliés, sur plusieurs continents.","À la fin de l'année 1941, la guerre européenne de 1939 est donc devenue une guerre mondiale."],
 in:"Le 8 décembre 1941, devant le Congrès, le président Roosevelt qualifie l'attaque de Pearl Harbor de date qui restera marquée par l'infamie. Deux ans plus tôt, en septembre 1939, la guerre n'opposait encore que l'Allemagne à la Pologne, au Royaume-Uni et à la France. Une guerre mondiale implique des belligérants et des théâtres d'opérations sur plusieurs continents, de l'Europe à l'Afrique du Nord et au Pacifique. Le verbe « devenir » invite à suivre une évolution, de 1939 à 1942, année où l'Axe atteint son extension maximale. Comment la guerre devient-elle mondiale entre 1939 et 1942 ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord la guerre européenne de 1939-1940, puis d'analyser sa mondialisation en 1941, et enfin d'exposer l'apogée de l'Axe et les premiers tournants de 1942.",
 tr:"En 1940, l'Allemagne domine donc l'Europe de l'Ouest. Mais en 1941, deux décisions vont étendre la guerre au monde entier.",
 co:"Entre 1939 et 1942, la guerre devient donc mondiale : d'abord européenne et dominée par l'Allemagne, elle s'étend en 1941 à l'URSS et au Pacifique, avant que l'Axe n'atteigne son apogée en 1942. La même année, Midway, El Alamein et Stalingrad montrent pourtant que son expansion est arrêtée."},
{q:"En quoi le régime de Vichy rompt-il avec la République ?",ty:["analytique"],
 b:["1940","1944","La France (zones occupée et non occupée) et son empire","10 juillet 1940 : vote des pleins pouvoirs à Pétain. Août 1944 : libération de Paris et fin du régime."],
 no:[["Régime de Vichy",["regime","vichy"],"Régime autoritaire dirigé par le maréchal Pétain de juillet 1940 à août 1944, installé à Vichy en zone non occupée."],["Rompre",["rompt"],"Le verbe demande de montrer une rupture : ce qui est supprimé, ce qui est remplacé."],["La République",["republique"],"Régime fondé sur la souveraineté nationale, les libertés et l'égalité des citoyens : ici la IIIe République (1870-1940)."]],
 p:[["Un régime né de la défaite qui met fin à la IIIe République",["La défaite et l'armistice du 22 juin 1940","Le vote des pleins pouvoirs à Pétain, 10 juillet 1940"]],["Un État autoritaire qui veut une Révolution nationale",["La fin des libertés et le culte du maréchal","« Travail, Famille, Patrie » contre « Liberté, Égalité, Fraternité »"]],["Un régime qui collabore et exclut",["La collaboration d'État avec l'occupant","L'antisémitisme d'État : du statut des Juifs (octobre 1940) à la rafle du Vél d'Hiv (juillet 1942)"]]],

 id:[["Les parlementaires votent les pleins pouvoirs à Pétain : 569 voix contre 80",0],["Actes constitutionnels du 11 juillet 1940",0],["Devise « Travail, Famille, Patrie »",1],["Dissolution des confédérations syndicales et culte du maréchal",1],["Entrevue de Montoire entre Pétain et Hitler, 24 octobre 1940",2],["Premier statut des Juifs, 3 octobre 1940",2]],
 ti:{i:1,o:[["Un État autoritaire qui veut une Révolution nationale",1,"Il qualifie le régime et dit ce qui rompt avec la République."],["Pétain",0,"Un nom n'est pas une idée."],["La France pendant la guerre",0,"Trop large : on ne sait pas ce que la partie démontre."],["La Résistance",0,"Hors de la question : le sujet porte sur le régime de Vichy."]]},
 ex:[["Le 3 octobre 1940, le premier statut des Juifs exclut les Juifs de la fonction publique sans demande allemande : l'antisémitisme est une politique propre à Vichy, ce qui rompt avec l'égalité républicaine.","ok","Daté, précis, et relié au sujet (« rompt »)."],["L'affaire Dreyfus (1894-1906).","hors","Hors des bornes : c'est la IIIe République."],["Vichy était un mauvais régime.","vague","Un jugement, pas un exemple."],["La rafle du Vél d'Hiv.","illus","Date, acteurs (la police française), bilan et signification ?"]],
 bt:["La rafle du Vél d'Hiv.","Les 16 et 17 juillet 1942, la police française arrête environ 13 000 Juifs à Paris, dont plus de 4 000 enfants, lors de la rafle du Vél d'Hiv : l'État français participe directement à la déportation, ce qui montre jusqu'où va la collaboration."],
 pp:0,pa:["Le régime de Vichy naît d'abord de la défaite de 1940.","Face à l'effondrement militaire, une partie des dirigeants choisit l'armistice plutôt que de continuer la guerre depuis l'empire ou le Royaume-Uni.","L'armistice est signé le 22 juin 1940, puis le 10 juillet, les parlementaires réunis à Vichy votent les pleins pouvoirs au maréchal Pétain par 569 voix contre 80.","Ce vote montre que la rupture se fait en apparence dans la légalité, mais que la République disparaît : dès le lendemain, Pétain se proclame chef de l'État français.","La défaite sert donc de justification à la fin de la IIIe République."],
 in:"Le 17 juin 1940, à la radio, le maréchal Pétain annonce aux Français qu'il faut cesser le combat. Quelques semaines plus tard, il devient chef de l'État français, un régime installé à Vichy en zone non occupée et qui durera jusqu'à la Libération, en août 1944. Ce régime remplace la IIIe République, fondée en 1870 sur la souveraineté nationale, les libertés et l'égalité des citoyens. Dans une France vaincue, coupée en deux et occupée en partie par l'Allemagne, il prétend redresser le pays. En quoi le régime de Vichy rompt-il avec la République ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord la naissance du régime dans la défaite, puis d'analyser la construction d'un État autoritaire, et enfin d'exposer la collaboration et l'exclusion qu'il organise.",
 tr:"Vichy naît donc de la défaite et de l'abandon de la République. Le nouveau régime se donne aussitôt un projet politique opposé aux valeurs républicaines.",
 co:"Le régime de Vichy rompt donc avec la République sur tous les plans : il naît de l'abandon des institutions de 1875, supprime les libertés, remplace la devise républicaine et exclut une partie des Français, en particulier les Juifs, en collaborant avec l'occupant. La Libération, en 1944, rétablit la légalité républicaine, mais la question de la responsabilité de l'État français restera longtemps débattue.",
 fi:{t:"Le régime de Vichy est le régime de Pétain. Il a collaboré avec les Allemands et il a fait arrêter les Juifs. Je pense que c'est la pire période de l'histoire de France. Le régime de Vichy a-t-il rompu avec la République ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord la défaite, puis la Révolution nationale, et enfin la collaboration.",e:["accroche","notions","chrono","spatial","pbq","je","enchainement"],n:"L'annonce du plan est correcte, mais tout ce qui la précède manque : ni accroche, ni définition de la République, ni bornes, ni cadre. « Je pense » introduit une opinion. La problématique est transformée (« a-t-il rompu » au lieu de « en quoi… rompt-il »), ce qui change la nature du sujet."},
 fc:{t:"Pour conclure, le régime de Vichy rompt avec la République puisqu'il supprime les libertés, remplace la devise républicaine et exclut une partie des Français. En plus, il faut savoir que Laval revient au pouvoir en avril 1942 et que la Milice est créée en janvier 1943 pour combattre la Résistance.",e:["nouveau"],n:"La première phrase répond bien. La seconde ajoute des faits nouveaux qui auraient dû nourrir la troisième partie : une conclusion n'apporte plus de connaissances."}},
{q:"Juin 1940 : continuer ou arrêter la guerre ?",ty:["debat"],
 b:["mai 1940","août 1940","La France, le Royaume-Uni et l'empire colonial","10 mai 1940 : offensive allemande. Juillet-août 1940 : fin de la République et reconnaissance de la France libre par Churchill."],
 no:[["Continuer",["continuer"],"Choix de poursuivre le combat, depuis l'empire ou le Royaume-Uni, aux côtés des Britanniques."],["Arrêter",["arreter"],"Choix de demander l'armistice, c'est-à-dire une suspension des combats négociée avec le vainqueur."]],
 p:[["Les arguments pour arrêter la guerre",["Une défaite militaire écrasante et l'exode","Pétain et Weygand : l'armistice pour « sauver » le pays et l'armée"]],["Les arguments pour continuer le combat",["Une guerre mondiale : l'empire, la flotte et l'allié britannique","De Gaulle et l'appel du 18 juin 1940"]],["Un choix aux conséquences décisives",["L'armistice du 22 juin et la fin de la République","La France libre : une légitimité alternative"]]],
 alt:"Plan chronologique possible : I. 10 mai-16 juin, la débâcle ; II. 16-22 juin, le choix de l'armistice ; III. 18 juin-août, deux France opposées.",
 id:[["Percée allemande à Sedan, mai 1940",0],["Exode de 8 à 10 millions de civils",0],["Discours de Pétain du 17 juin 1940",0],["Appel du général de Gaulle sur la BBC, 18 juin 1940",1],["Départ de parlementaires sur le Massilia vers l'Afrique du Nord (21 juin 1940)",1],["Vote des pleins pouvoirs à Pétain, 10 juillet 1940",2],["Accord Churchill-de Gaulle reconnaissant la France libre, 7 août 1940",2]],
 ti:{i:0,o:[["Les arguments pour arrêter la guerre",1,"Il annonce clairement le premier point de vue à discuter."],["Pétain",0,"Un nom, pas une idée."],["La défaite",0,"Un fait, pas l'argument à discuter."],["Pétain avait raison",0,"Un jugement : dans un sujet-débat, on expose d'abord les arguments et on tranche à la fin."]]},
 ex:[["Le 18 juin 1940, sur la BBC, de Gaulle affirme que la France a perdu une bataille mais pas la guerre, puisqu'elle dispose de son empire et de l'appui britannique : continuer, c'est parier sur une guerre mondiale.","ok","Exploité : il éclaire l'argument pour continuer."],["Le débarquement de Provence, août 1944.","hors","Hors des bornes."],["Les Français étaient tristes.","vague","Aucun fait vérifiable."],["L'exode.","illus","Combien de personnes, quand, et pourquoi est-ce un argument pour arrêter ?"]],
 bt:["L'exode.","En mai-juin 1940, entre 8 et 10 millions de civils fuient sur les routes devant l'avancée allemande. Ce chaos montre l'ampleur de la défaite et sert d'argument à Pétain pour réclamer l'armistice et « protéger » la population."],
 pp:1,pa:["Face à ceux qui veulent arrêter les combats, d'autres jugent qu'il faut continuer la guerre.","En effet, pour eux, la défaite de mai-juin 1940 n'est qu'une bataille perdue : la France conserve une flotte intacte, un vaste empire colonial et l'alliance du Royaume-Uni.","Le 18 juin 1940, depuis Londres, le général de Gaulle lance sur la BBC un appel à poursuivre le combat.","Cet appel montre que le refus de l'armistice repose sur une lecture mondiale du conflit : la guerre finira par être gagnée grâce aux ressources des Alliés.","Ce choix, d'abord très minoritaire, fonde la France libre."],
 in:"Le 17 juin 1940, Pétain déclare à la radio qu'il faut cesser le combat ; le lendemain, depuis Londres, le général de Gaulle appelle au contraire à le poursuivre. Depuis la percée allemande du 10 mai, l'armée française s'effondre et des millions de civils fuient sur les routes. Les dirigeants doivent choisir entre continuer la guerre, depuis l'empire ou aux côtés du Royaume-Uni, et arrêter, c'est-à-dire demander un armistice à l'Allemagne. Ce choix engage l'avenir du régime et la place de la France dans la guerre. Juin 1940 : continuer ou arrêter la guerre ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord les arguments en faveur de l'armistice, puis d'analyser ceux qui plaident pour la poursuite du combat, et enfin d'exposer les conséquences de ce choix décisif.",
 tr:"La défaite semble donc justifier l'arrêt des combats. Pourtant, certains refusent cette logique et considèrent que la guerre n'est pas finie.",
 co:"En juin 1940, arrêter la guerre semble donc s'imposer à la majorité des dirigeants face à une défaite militaire écrasante, tandis que continuer repose sur un pari, celui d'une guerre mondiale où la France garderait sa place grâce à son empire et à ses alliés. L'armistice du 22 juin conduit à la fin de la République, alors que l'appel du 18 juin fonde la France libre. Ce choix initial structure tout le débat sur la légitimité du pouvoir pendant l'Occupation."},

 b:["1945","1945","Le monde : Europe, URSS, États-Unis, Asie, empires coloniaux","Sujet-tableau : on étudie l'état du monde à une date, en remontant aux causes et en montrant ce qui s'amorce."],
 no:[["Le monde",["monde"],"Il faut couvrir plusieurs espaces : Europe, Asie, empires coloniaux, puissances."],["1945",["1945"],"Fin de la guerre en Europe (8 mai) et en Asie (2 septembre), naissance de l'ONU (juin)."]],

 ti:{i:2,o:[["Un monde nouveau et déjà divisé",1,"Il caractérise le monde de 1945 et ouvre sur ce qui s'amorce."],["La guerre froide",0,"Anachronique en 1945 : elle commence en 1947."],["Les États-Unis",0,"Trop étroit pour un sujet sur le monde."],["Après",0,"Ne veut rien dire sans complément."]]},
 ex:[["Le 26 juin 1945, à San Francisco, est signée la Charte des Nations unies, qui réunit 51 pays fondateurs : le Conseil de sécurité, où siègent cinq membres permanents, doit garantir la paix grâce à la sécurité collective.","ok","Précis et exploité : il montre la volonté d'organiser la paix."],["La chute du mur de Berlin, 1989.","hors","Hors sujet : le sujet-tableau porte sur 1945."],["Le monde était détruit.","vague","Exagéré et imprécis."],["Le procès de Nuremberg.","illus","Dates, accusés, et surtout la notion qu'il consacre (crime contre l'humanité) ?"]],
 bt:["Le procès de Nuremberg.","De novembre 1945 à octobre 1946, le tribunal militaire international de Nuremberg juge 22 hauts responsables nazis et retient pour la première fois la notion de crime contre l'humanité. Cela montre que les vainqueurs veulent fonder la paix sur le droit et créer une justice internationale."],
 pp:1,pa:["En 1945, les vainqueurs veulent organiser une paix durable.","Ils tirent les leçons de l'échec de la Société des Nations, incapable d'empêcher la guerre dans les années 1930.","Le 26 juin 1945, à San Francisco, est signée la Charte des Nations unies, qui réunit 51 pays fondateurs et crée un Conseil de sécurité dont les cinq membres permanents disposent d'un droit de veto.","Cet exemple montre que la sécurité collective repose désormais sur l'accord des grandes puissances victorieuses : c'est sa force, mais aussi sa fragilité.","Le monde de 1945 se dote ainsi d'institutions nouvelles pour éviter une nouvelle guerre."],
 in:"Le 8 mai 1945, des foules en liesse célèbrent la capitulation allemande à Paris, à Londres et à New York, mais le même jour, à Sétif, en Algérie, une manifestation nationaliste est réprimée dans le sang. L'année 1945 marque la fin de la Seconde Guerre mondiale, en Europe en mai puis en Asie en septembre après les bombardements atomiques d'Hiroshima et de Nagasaki. Étudier le monde à cette date, c'est dresser un état des lieux de toutes les régions du globe, de l'Europe ruinée aux empires coloniaux, au moment où deux puissances, les États-Unis et l'URSS, dominent. Dans quel état se trouve le monde en 1945 ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord un monde traumatisé par la guerre, puis d'analyser la volonté d'organiser la paix, et enfin d'exposer un monde nouveau et déjà divisé.",
 tr:"Le monde de 1945 sort donc traumatisé de la guerre. Pour éviter qu'une telle catastrophe se reproduise, les vainqueurs cherchent à organiser la paix.",
 co:"En 1945, le monde est donc à la fois traumatisé par une guerre d'anéantissement, tourné vers l'organisation de la paix avec l'ONU et la justice internationale, et déjà transformé par la domination de deux superpuissances et l'ébranlement des empires coloniaux. Ces tensions annoncent de nouveaux affrontements.",
 fi:{t:"En 1945, la guerre se termine. Je vais présenter le monde en 1945. Le monde est détruit et il y a la guerre froide entre les États-Unis et l'URSS. Dans quel état se trouve le monde en 1945 ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord les bilans, puis l'ONU, et enfin la guerre froide.",e:["accroche","notions","spatial","je","exact","enchainement"],n:"La problématique est bien reprise et le plan annoncé avec des connecteurs. Mais il n'y a ni accroche ni cadre spatial, et « je vais présenter » est à bannir. Surtout, la guerre froide est un anachronisme en 1945 : elle commence en 1947."},
 fc:{t:"En conclusion, le monde en 1945 est détruit. Il y a eu énormément de morts et de destructions. C'est pourquoi la guerre froide était inévitable.",e:["reponse","teleo"],n:"La réponse ne reprend qu'une idée sur trois (le traumatisme) et oublie l'organisation de la paix et le nouvel équilibre. « Inévitable » est téléologique."}},

 p:[["Juger les crimes et refonder le droit",["Le procès de Nuremberg et la notion de crime contre l'humanité","La Déclaration universelle des droits de l'homme (10 décembre 1948)"]],["Organiser la paix et l'économie mondiale",["L'ONU et la sécurité collective","Bretton Woods : le dollar au centre du système monétaire"]],["Un ordre vite fragilisé par la rupture entre les vainqueurs",["Doctrine Truman et doctrine Jdanov (1947)","Plan Marshall et coup de Prague (février 1948)"]]],

 ti:{i:2,o:[["Un ordre vite fragilisé par la rupture entre les vainqueurs",1,"Il montre la limite du nouvel ordre : la partie nuance la démonstration."],["La guerre froide",0,"Un thème : que démontres-tu sur la guerre froide par rapport au sujet ?"],["Les problèmes",0,"Trop vague."],["La guerre de Corée",0,"Hors des bornes (1950-1953)."]]},
 ex:[["Le 10 décembre 1948, l'Assemblée générale de l'ONU adopte à Paris la Déclaration universelle des droits de l'homme, à laquelle contribue René Cassin : le nouvel ordre veut fonder la paix sur des droits universels.","ok","Exploité et relié au sujet."],["Le traité de Versailles (1919).","hors","Hors des bornes : il concerne l'ordre de 1919."],["Les pays ont fait la paix.","vague","Quels pays, par quels moyens ?"],["Le plan Marshall.","illus","Date, et pourquoi divise-t-il l'Europe ?"]],
 bt:["Le plan Marshall.","Annoncé en juin 1947, le plan Marshall offre une aide américaine à la reconstruction de l'Europe ; Staline l'interdit aux pays sous influence soviétique, ce qui coupe l'Europe en deux camps."],
 pp:1,pa:["Pour garantir la paix, les vainqueurs créent de nouvelles institutions internationales.","En effet, ils veulent éviter l'impuissance de la Société des Nations et empêcher le retour d'une crise économique comme celle des années 1930.","En juillet 1944, les accords de Bretton Woods créent le FMI et la Banque mondiale et font du dollar, convertible en or, la monnaie de référence ; en juin 1945, la Charte de San Francisco fonde l'ONU.","Ces décisions montrent que le nouvel ordre est à la fois politique et économique, et qu'il repose largement sur la puissance des États-Unis.","La paix doit désormais être collective et organisée."],
 in:"En juillet 1944, alors que la guerre fait encore rage, les délégués de 44 pays se réunissent dans un hôtel de Bretton Woods, aux États-Unis, pour réorganiser l'économie mondiale. Les vainqueurs, c'est-à-dire les Alliés, veulent bâtir un nouvel ordre mondial, une nouvelle organisation des relations internationales capable d'éviter une autre guerre et une autre crise comme celle de 1929. De 1944 à 1948, des États-Unis à l'Europe, ils créent des institutions, jugent les crimes nazis et proclament des droits universels, mais leur alliance se défait rapidement. Comment les vainqueurs tentent-ils de bâtir un nouvel ordre mondial entre 1944 et 1948 ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord la volonté de juger les crimes et de refonder le droit, puis d'analyser l'organisation de la paix et de l'économie mondiale, et enfin d'exposer la fragilisation rapide de cet ordre.",
 tr:"Les vainqueurs veulent donc fonder la paix sur le droit. Juger les crimes et proclamer des droits ne suffit pourtant pas : il faut aussi des institutions capables de garantir la paix et la prospérité.",
 co:"Entre 1944 et 1948, les vainqueurs bâtissent donc un nouvel ordre mondial fondé sur le droit, la sécurité collective et la coopération économique. Mais leur rupture, visible dès 1947, en limite rapidement la portée, car l'ONU est paralysée par l'opposition entre les États-Unis et l'URSS. Le monde entre dans la guerre froide."},

{q:"Comment la guerre froide organise-t-elle les relations internationales de 1947 au début des années 1970 ?",ty:["chronologique","analytique"],
 b:["1947","1972","Le monde : Europe, Asie, Amérique latine","1947 : doctrines Truman et Jdanov. Début des années 1970 : détente, accords SALT I (1972)."],

 ti:{i:1,o:[["1953-1962 : coexistence pacifique et crises",1,"Les bornes sont associées à une idée qui caractérise la période."],["Les crises",0,"Un thème sans idée ni période."],["Khrouchtchev",0,"Un nom n'est pas une idée."],["1953-1962",0,"Des dates seules ne démontrent rien."]]},
 ex:[["En octobre 1962, l'installation de missiles soviétiques à Cuba conduit au bord de la guerre nucléaire ; le compromis entre Kennedy et Khrouchtchev montre que les deux Grands évitent l'affrontement direct.","ok","Exploité : il explique la logique de la guerre froide."],["La disparition de l'URSS en 1991.","hors","Hors des bornes du sujet."],["Les deux pays se détestaient.","vague","Ni fait ni date."],["La guerre de Corée.","illus","Dates, acteurs, et ce qu'elle montre ?"]],
 bt:["La guerre de Corée.","De 1950 à 1953, la guerre de Corée oppose le Nord communiste, soutenu par la Chine et l'URSS, au Sud défendu par une coalition sous mandat de l'ONU dirigée par les États-Unis. Cet exemple montre que la guerre froide devient une guerre chaude, mais limitée à un espace périphérique."],
 pp:0,pa:["De 1947 à 1953, le monde se divise en deux blocs opposés.","L'alliance de la guerre s'est rompue, et chaque superpuissance veut empêcher l'expansion de l'autre.","En mars 1947, Truman annonce la politique d'endiguement du communisme ; en septembre, Jdanov lui répond en dénonçant le camp « impérialiste » mené par les États-Unis.","Ces deux doctrines montrent que l'affrontement est d'abord idéologique : chaque camp se présente comme le défenseur d'un modèle universel.","Les blocs se dotent ensuite d'alliances militaires, comme l'OTAN en 1949."],
 in:"En août 1961, en une nuit, des barbelés coupent Berlin en deux ; ils sont bientôt remplacés par un mur de béton. Ce mur devient le symbole de la guerre froide, cet affrontement entre les États-Unis et l'URSS qui, de 1947 au début des années 1970, ne débouche jamais sur une guerre directe entre eux. Les relations internationales, c'est-à-dire les rapports d'alliance, de conflit et de négociation entre les États, sont alors structurées autour de deux blocs, de l'Europe à l'Asie et à l'Amérique latine. Comment la guerre froide organise-t-elle les relations internationales de 1947 au début des années 1970 ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord la formation des blocs, puis d'analyser la période de coexistence pacifique et de crises, et enfin d'exposer la détente sous tension.",
 tr:"En 1953, le monde est donc divisé en deux blocs armés. La mort de Staline ouvre pourtant une période nouvelle, faite de dialogue et de crises.",
 co:"De 1947 au début des années 1970, la guerre froide organise donc les relations internationales autour de deux blocs qui s'affrontent sans guerre directe : formation des alliances, crises au bord du conflit, puis détente encadrée par des accords. Mais ce monde bipolaire est de plus en plus contesté par de nouveaux acteurs, en particulier les pays du tiers-monde.",
 fi:{t:"La guerre froide, c'est quand les États-Unis et l'URSS s'affrontent sans se faire la guerre. Elle commence en 1947. Il y a eu beaucoup de crises comme Berlin, Cuba et le Vietnam. Je vais montrer comment la guerre froide organise le monde. Tout d'abord, je parlerai des blocs, ensuite des crises et enfin de la détente.",e:["accroche","spatial","pbq","annonce","je","enchainement"],n:"La définition est un bon début, mais elle ne remplace pas l'accroche. La problématique n'est jamais posée, et « je vais montrer… je parlerai » remplace la formule attendue. Les exemples cités (Berlin, Cuba, Vietnam) appartiennent au développement."},
 fc:{t:"En conclusion, la guerre froide organise les relations internationales en deux blocs de 1947 au début des années 1970, des crises et de la détente. Il faut noter que la crise de Suez, en 1956, montre aussi que les deux Grands peuvent s'entendre contre la France et le Royaume-Uni.",e:["nouveau","ouverture"],n:"La réponse est trop sèche, et la seconde phrase ajoute un exemple nouveau (Suez) au lieu d'ouvrir le sujet."}},
{q:"Comment les pays du tiers-monde s'affirment-ils dans un monde bipolaire (1947-début des années 1970) ?",ty:["analytique"],
 b:["1947","1972","Asie, Afrique, Amérique latine","1947 : indépendance de l'Inde. Début des années 1970 : un tiers-monde nombreux mais divisé."],
 no:[["Tiers-monde",["tiers-monde"],"Expression d'Alfred Sauvy (1952) pour les pays pauvres, souvent issus de la colonisation, qui refusent d'être réduits à un enjeu entre les deux blocs."],["Monde bipolaire",["monde","bipolaire"],"Monde organisé autour de deux pôles de puissance, les États-Unis et l'URSS."],["S'affirmer",["affirment"],"Conquérir son indépendance puis faire entendre sa voix sur la scène internationale."]],
 p:[["Les décolonisations font naître de nouveaux États",["En Asie : l'Inde (1947), l'Indochine (1954)","En Afrique : l'Algérie et les indépendances de 1960"]],["Le tiers-monde cherche une voie entre les deux blocs",["La conférence de Bandung (avril 1955)","Le mouvement des non-alignés (Belgrade, 1961)"]],["Des pays souvent pris dans la guerre froide",["Nasser et la crise de Suez (1956)","Cuba et le Vietnam, terrains d'affrontement des Grands"]]],
 alt:"Plan chronologique possible : I. 1947-1955, les premières indépendances ; II. 1955-1962, l'affirmation politique ; III. 1962-début des années 1970, un tiers-monde divisé et convoité.",

 ti:{i:1,o:[["Le tiers-monde cherche une voie entre les deux blocs",1,"Il dit ce que font les acteurs et en quoi cela répond au sujet."],["Bandung",0,"Un exemple n'est pas un titre de partie."],["Le non-alignement",0,"Une notion seule : que démontres-tu ?"],["L'URSS",0,"Hors de l'axe : le sujet porte sur les pays du tiers-monde."]]},
 ex:[["En avril 1955, 29 pays d'Asie et d'Afrique réunis à Bandung condamnent le colonialisme et affirment leur volonté de rester à l'écart de l'affrontement Est-Ouest.","ok","Daté, chiffré, relié à l'affirmation du tiers-monde."],["L'indépendance de l'Algérie en 1830.","faux","Erreur : 1830 est le début de la conquête française ; l'indépendance date de 1962."],["Les pays pauvres voulaient être libres.","vague","Lesquels, comment ?"],["Nasser.","illus","Qui est-il, qu'a-t-il fait, qu'est-ce que cela montre ?"]],
 bt:["Nasser.","En juillet 1956, le président égyptien Nasser nationalise le canal de Suez ; l'expédition franco-britannique qui suit doit se retirer sous la pression des États-Unis et de l'URSS. Cela montre qu'un pays du tiers-monde peut faire reculer deux anciennes puissances coloniales."],
 pp:1,pa:["Les nouveaux États cherchent aussi à peser sur les relations internationales.","Beaucoup refusent de choisir entre le bloc américain et le bloc soviétique et veulent défendre leurs propres intérêts.","En avril 1955, la conférence de Bandung réunit 29 pays d'Asie et d'Afrique qui condamnent le colonialisme ; en 1961, le sommet de Belgrade lance le mouvement des non-alignés.","Ces rencontres montrent que le tiers-monde s'affirme comme un acteur collectif, qui fait de la décolonisation et du développement ses priorités.","Le monde n'est donc plus seulement bipolaire."],
 in:"En 1952, le démographe Alfred Sauvy compare les pays pauvres au tiers état de 1789, ignoré et exploité, qui veut lui aussi devenir quelque chose. Le tiers-monde désigne ces pays d'Asie, d'Afrique et d'Amérique latine, souvent issus de la colonisation, qui refusent d'être un simple enjeu entre les deux blocs. Depuis 1947, le monde est en effet bipolaire, organisé autour des États-Unis et de l'URSS, tandis que les empires coloniaux européens se défont. Comment les pays du tiers-monde s'affirment-ils dans un monde bipolaire (1947-début des années 1970) ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord la naissance de nouveaux États par la décolonisation, puis d'analyser leur recherche d'une voie entre les deux blocs, et enfin d'exposer comment ils restent pris dans la guerre froide.",
 tr:"La décolonisation fait donc naître de nombreux États. Ceux-ci veulent désormais faire entendre leur voix dans un monde dominé par deux superpuissances.",
 co:"Les pays du tiers-monde s'affirment donc par la conquête de leur indépendance, puis par leur volonté de rester à l'écart des blocs, de Bandung aux non-alignés. Cette affirmation reste toutefois limitée, car beaucoup deviennent des terrains d'affrontement entre les Grands. Dans les années 1970, la crise économique va accentuer leurs divisions."},

{th:1,n:"2.3",t:"La France : une nouvelle place dans le monde",s:[
{q:"Comment la France cherche-t-elle à redéfinir sa place dans le monde de 1945 au début des années 1970 ?",ty:["analytique","chronologique"],
 b:["1945","1969","La France, son empire colonial, l'Europe et le monde","1945 : la France parmi les vainqueurs. 1969 : départ du général de Gaulle."],
 no:[["Redéfinir",["redefinir"],"Le verbe suppose une perte (défaite de 1940, empire) et la recherche de nouveaux moyens de puissance."],["Place dans le monde",["place"],"Rang et influence d'un État : puissance militaire, diplomatique, économique, culturelle."]],
 p:[["Une puissance affaiblie qui choisit le camp occidental",["Reconstruction et aide américaine (plan Marshall)","Membre fondateur de l'OTAN (1949)"]],["La fin de l'empire colonial",["La guerre d'Indochine (1946-1954)","La guerre d'Algérie et les accords d'Évian (1962)"]],["La politique de grandeur du général de Gaulle",["L'arme nucléaire (1960) et la sortie du commandement intégré de l'OTAN (1966)","Une diplomatie indépendante et l'Europe des États"]]],
 alt:"Plan chronologique possible : I. 1945-1954, une puissance diminuée sous la IVe République ; II. 1954-1962, une décolonisation douloureuse ; III. 1962-1969, la grandeur gaullienne.",
 id:[["Membre permanent du Conseil de sécurité de l'ONU (1945)",0],["Signature du traité de l'Atlantique Nord, avril 1949",0],["Défaite de Dien Bien Phu, mai 1954",1],["Accords d'Évian, 18 mars 1962",1],["Premier essai nucléaire à Reggane, février 1960",2],["Reconnaissance de la Chine populaire, janvier 1964",2]],
 ti:{i:2,o:[["La politique de grandeur du général de Gaulle",1,"Il nomme un acteur et une idée directrice."],["De Gaulle",0,"Un nom, pas une idée."],["La bombe atomique",0,"Un exemple, pas une idée de partie."],["La Ve République",0,"Hors de l'axe : le sujet porte sur la place de la France dans le monde, pas sur ses institutions."]]},
 ex:[["En mars 1966, de Gaulle annonce le retrait de la France du commandement militaire intégré de l'OTAN : il veut une défense indépendante sans quitter l'Alliance atlantique.","ok","Exploité : il montre la recherche d'indépendance."],["L'intervention française au Mali (2013).","hors","Hors des bornes."],["La France voulait être puissante.","vague","Aucun fait."],["Les accords d'Évian.","illus","Date et signification pour la place de la France ?"]],
 bt:["Les accords d'Évian.","Signés le 18 mars 1962, les accords d'Évian mettent fin à la guerre d'Algérie et ouvrent la voie à l'indépendance. Cela montre que la France renonce à l'essentiel de son empire et cherche désormais son influence par d'autres moyens."],
 pp:1,pa:["Après 1945, la France perd progressivement son empire colonial.","En effet, les peuples colonisés réclament leur indépendance, et la France, affaiblie par la guerre, refuse d'abord de la leur accorder.","La guerre d'Indochine (1946-1954) s'achève par la défaite de Dien Bien Phu en mai 1954 ; la guerre d'Algérie (1954-1962) se termine par les accords d'Évian du 18 mars 1962.","Ces deux guerres montrent que la décolonisation française est longue et violente, et qu'elle contribue à la chute de la IVe République en 1958.","À la fin de cette période, la France doit trouver une nouvelle place dans le monde sans son empire."],
 in:"Le 7 mai 1954, à Dien Bien Phu, la garnison française capitule face aux troupes du Viêt-minh : une armée européenne est vaincue par un mouvement de libération coloniale. Dix ans plus tôt, la France sortait de la Seconde Guerre mondiale affaiblie, mais dans le camp des vainqueurs et dotée d'un siège permanent au Conseil de sécurité de l'ONU. De 1945 au début des années 1970, elle doit redéfinir sa place dans le monde, c'est-à-dire trouver de nouveaux moyens d'influence, dans un monde bipolaire où elle perd son empire. Comment la France cherche-t-elle à redéfinir sa place dans le monde de 1945 au début des années 1970 ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord le choix du camp occidental, puis d'analyser la fin de l'empire colonial, et enfin d'exposer la politique de grandeur du général de Gaulle.",
 tr:"La France s'ancre donc dans le camp occidental. Elle reste pourtant une puissance coloniale, et son empire se défait dans la guerre.",
 co:"De 1945 au début des années 1970, la France redéfinit donc sa place dans le monde : alliée des États-Unis, elle perd son empire au terme de guerres longues, puis cherche avec de Gaulle une indépendance fondée sur l'arme nucléaire et une diplomatie propre. Puissance moyenne, elle mise aussi sur la construction européenne pour peser davantage.",
 fi:{t:"Après 1945, la France a perdu sa place de grande puissance. Elle a fait la guerre en Indochine et en Algérie, puis de Gaulle a voulu la grandeur. Comment la France retrouve-t-elle sa puissance ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord l'Indochine, puis l'Algérie et enfin de Gaulle.",e:["accroche","notions","chrono","pbq","enchainement"],n:"Il manque l'accroche et la définition de « place dans le monde ». La borne de fin n'est pas donnée. La problématique est réécrite et suppose déjà la réponse (« retrouve »). Le plan annoncé est un catalogue d'exemples, pas trois idées."},
 fc:{t:"Pour conclure, la France a perdu son empire mais a trouvé une nouvelle place grâce au général de Gaulle, qui était le plus grand homme politique français du XXe siècle.",e:["reponse","nouveau"],n:"La réponse oublie le choix du camp occidental, et la fin est un jugement personnel, sans rapport avec la démonstration."}},
{q:"Charles de Gaulle et Pierre Mendès France : deux conceptions de la République ?",ty:["comparatif","debat"],
 b:["1944","1969","La France","1944 : de Gaulle à la tête du Gouvernement provisoire, Mendès France ministre. 1969 : départ de De Gaulle."],
 no:[["Conceptions de la République",["conceptions"],"Idée que chacun se fait de l'organisation des pouvoirs : rôle du chef de l'État, du Parlement, des citoyens."],["La République",["republique"],"Régime fondé sur la souveraineté du peuple, les libertés et l'égalité ; ici la IVe (1946-1958) puis la Ve République (depuis 1958)."]],
 p:[["De Gaulle : une République fondée sur un exécutif fort",["Le discours de Bayeux (16 juin 1946)","La Constitution de 1958 et l'élection du président au suffrage universel (1962)"]],["Mendès France : une République parlementaire et une démocratie exigeante",["Un président du Conseil qui rend des comptes (1954-1955)","Le refus de la Ve République et La République moderne (1962)"]],["Deux hommes que tout ne sépare pas",["Deux résistants attachés à l'intérêt général","Deux acteurs de la décolonisation : Indochine (1954), Algérie (1962)"]]],
 alt:"Plan chronologique possible : I. 1944-1946, deux hommes de la Libération ; II. 1954-1958, l'expérience Mendès France et la fin de la IVe ; III. 1958-1969, la République gaullienne et son opposant.",
 id:[["Discours de Bayeux, 16 juin 1946",0],["Référendum sur l'élection du président au suffrage universel direct, octobre 1962",0],["Article 16 de la Constitution : pouvoirs exceptionnels",0],["Accords de Genève sur l'Indochine, juillet 1954",1],["Causeries radiophoniques de Mendès France",1],["Tous deux engagés dans la France libre",2]],
 ti:{i:1,o:[["Mendès France : une République parlementaire et une démocratie exigeante",1,"Il définit précisément la conception de l'acteur."],["Mendès France",0,"Un nom seul."],["La IVe République",0,"Le sujet compare deux conceptions, pas deux régimes."],["Un homme honnête",0,"Jugement moral, pas idée historique."]]},
 ex:[["Dans le discours de Bayeux, le 16 juin 1946, de Gaulle réclame un chef de l'État placé au-dessus des partis, arbitre des institutions : c'est la matrice de la Constitution de 1958.","ok","Exploité : relié à la conception gaullienne."],["Le référendum de 2005 sur le traité constitutionnel européen.","hors","Hors des bornes."],["Ils n'étaient pas d'accord.","vague","Sur quoi ?"],["La République moderne.","illus","Auteur, date et idée défendue ?"]],
 bt:["La République moderne.","Dans La République moderne (1962), Mendès France critique la place prise par le président et défend un gouvernement responsable devant le Parlement, lié aux électeurs par un contrat clair. Cela montre qu'il refuse une République où le président concentre le pouvoir."],
 pp:0,pa:["Pour de Gaulle, la République doit d'abord reposer sur un exécutif fort.","Il attribue l'effondrement de 1940 et l'instabilité de la IVe République au « régime des partis » et à la faiblesse des gouvernements.","Dès le discours de Bayeux du 16 juin 1946, il réclame un chef de l'État au-dessus des partis ; la Constitution de 1958, puis l'élection du président au suffrage universel direct en 1962, traduisent cette conception.","Ces étapes montrent que, pour de Gaulle, la légitimité vient du lien direct entre le chef de l'État et le peuple, notamment par le référendum.","Sa République est donc présidentielle avant d'être parlementaire."],
 in:"Le 1er juin 1958, quand l'Assemblée investit le général de Gaulle, Pierre Mendès France vote contre. Les deux hommes ont pourtant combattu ensemble dans la France libre et partagent le même sens de l'État. Une conception de la République est une idée de l'organisation des pouvoirs, du rôle du chef de l'État, du Parlement et des citoyens. De la Libération en 1944 au départ de De Gaulle en 1969, la France change de régime en 1958, et ce débat traverse toute la vie politique. Charles de Gaulle et Pierre Mendès France : deux conceptions de la République ? Pour répondre à cette problématique, il conviendra d'étudier tout d'abord la République gaullienne fondée sur un exécutif fort, puis d'analyser la conception parlementaire et exigeante de Mendès France, et enfin d'exposer ce qui rapproche les deux hommes.",
 tr:"La conception gaullienne place donc le chef de l'État au cœur des institutions. Mendès France défend au contraire une République où le pouvoir rend sans cesse des comptes.",
 co:"De Gaulle et Mendès France incarnent donc deux conceptions de la République : l'une fondée sur un président fort lié directement au peuple, l'autre sur un gouvernement responsable devant le Parlement et les citoyens. Ces deux visions, issues de la Résistance, se rejoignent pourtant sur l'essentiel : servir l'intérêt général. Le débat sur l'équilibre des pouvoirs de la Ve République reste ouvert aujourd'hui."},
